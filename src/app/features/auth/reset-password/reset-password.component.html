<div class="auth-page-container min-vh-100 d-flex align-items-center justify-content-center p-3 p-md-4">
  
  <div class="auth-box-wrapper w-100 fade-up" style="max-width: 480px;">
    
    <!-- Glassmorphic Card -->
    <div class="premium-card p-4 p-sm-5 position-relative">
      
      <!-- Luminous Top Accent Bar -->
      <div class="card-glow-bar"></div>

      <!-- Header: Logo & Title -->
      <div class="text-center mb-4">
        <div class="d-inline-flex mb-3">
          <div class="auth-logo-box">
            <i class="bi bi-shield-lock-fill fs-2"></i>
            <span class="auth-logo-glow"></span>
          </div>
        </div>

        <h3 class="brand-font fw-extrabold text-white mb-1">
          Nouveau Mot de Passe
        </h3>
        <p class="text-subtle small mb-0">
          Définissez un mot de passe robuste pour sécuriser l'accès à votre compte.
        </p>
      </div>

      <!-- Alert Error -->
      <div class="alert alert-danger border-0 rounded-3 small mb-3 d-flex align-items-center" *ngIf="error">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        <span>{{ error }}</span>
      </div>

      <!-- Alert Success -->
      <div class="alert alert-success border-0 rounded-3 small mb-3 d-flex align-items-center" *ngIf="successMsg">
        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
        <div>
          <div>{{ successMsg }}</div>
          <small class="text-white-50">Redirection vers la page de connexion...</small>
        </div>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" *ngIf="!successMsg">
        
        <div class="mb-3">
          <label class="form-label text-light fw-bold small mb-1">Nouveau mot de passe</label>
          <div class="input-with-icon">
            <i class="bi bi-lock-fill input-icon"></i>
            <input
              type="password"
              class="form-control input-premium ps-5"
              [(ngModel)]="newPassword"
              name="newPassword"
              required
              placeholder="••••••••"
              minlength="6">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-light fw-bold small mb-1">Confirmer le mot de passe</label>
          <div class="input-with-icon">
            <i class="bi bi-shield-check input-icon"></i>
            <input
              type="password"
              class="form-control input-premium ps-5"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required
              placeholder="••••••••"
              minlength="6">
          </div>
        </div>

        <button type="submit" class="btn-ai-glow w-100 py-3 mb-3" [disabled]="loading || !newPassword || !confirmPassword">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!loading" class="bi bi-check2-circle me-1"></i>
          {{ loading ? 'Mise à jour en cours...' : 'Sauvegarder le nouveau mot de passe' }}
        </button>
      </form>

      <!-- Back to Login -->
      <div class="text-center pt-2 border-top border-white-10">
        <a routerLink="/login" class="text-subtle small text-decoration-none hover-white">
          <i class="bi bi-arrow-left me-1"></i> Retour à la page de connexion
        </a>
      </div>

    </div>

  </div>

</div>
